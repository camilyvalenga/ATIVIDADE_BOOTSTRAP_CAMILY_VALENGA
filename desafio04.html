<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 04 - Formulário de Agendamento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

  <!-- Navbar Padrão -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">DS • Bootstrap 5</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPortifolio" aria-controls="menuPortifolio" aria-expanded="false" aria-label="Alternar navegação">
        <span class="navbar-toggler-icon"></span>
      </button>
      
      <div class="collapse navbar-collapse" id="menuPortifolio">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
          <li class="nav-item"><a class="nav-link" href="desafio01.html">Desafio 01</a></li>
          <li class="nav-item"><a class="nav-link" href="desafio02.html">Desafio 02</a></li>
          <li class="nav-item"><a class="nav-link" href="desafio03.html">Desafio 03</a></li>
          <li class="nav-item"><a class="nav-link active" href="desafio04.html">Desafio 04</a></li>
          <li class="nav-item"><a class="nav-link" href="desafio05.html">Desafio 05</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Conteúdo -->
  <main class="container my-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-0 p-4">
                <h3 class="mb-3 fw-bold h5">Ordem de Serviço</h3>
                <form>
                    <div class="row g-3">
                        <div class="col-sm-6">
                            <label class="form-label small">Nome</label>
                            <input type="text" class="form-control form-control-sm" placeholder="Carlos" required>
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label small">Sobrenome</label>
                            <input type="text" class="form-control form-control-sm" placeholder="Menezes" required>
                        </div>

                        <div class="col-12">
                            <label class="form-label small">WhatsApp</label>
                            <div class="input-group input-group-sm">
                                <span class="input-group-text">+55</span>
                                <input type="text" class="form-control" placeholder="(41) 99999-9999">
                            </div>
                        </div>

                        <div class="col-12">
                            <label class="form-label small">Tipo de Serviço</label>
                            <select class="form-select form-select-sm">
                                <option selected>Selecione...</option>
                                <option value="1">Formatação</option>
                                <option value="2">Troca de Tela</option>
                                <option value="3">Limpeza</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label small">Observações</label>
                            <textarea class="form-control form-control-sm" rows="2" placeholder="Descreva o problema..."></textarea>
                        </div>

                        <div class="col-12">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="termos" required>
                                <label for="termos" class="form-check-label small text-muted">
                                    Concordo com o prazo de 3 dias para orçamento.
                                </label>
                            </div>
                        </div>

                        <div class="col-12 mt-3">
                            <button class="btn btn-success btn-sm w-100" type="submit">Enviar Ordem</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
  </main>

  <footer class="bg-dark text-white-50 text-center py-3 mt-auto">
    <div class="container"><small>Curso Técnico em Desenvolvimento de Sistemas • SESI/SENAI Campo Largo</small></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
